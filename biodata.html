    <h2>FORMULIR BIODATA MAHASISWA</h2>

    <p class="contoh-inline">Silakan lengkapi data biodata mahasiswa.</p>

    <form onsubmit="return validasiBiodata();">

        <p>
            <label for="nim">NIM</label><br>
            <input type="text" id="nim" name="nim">
        </p>

        <p>
            <label for="nama">Nama</label><br>
            <input type="text" id="nama" name="nama">
        </p>

        <p>
            <label for="jenisKelamin">Jenis Kelamin</label><br>
            <select id="jenisKelamin" name="jenisKelamin">
                <option value="">-- Pilih Jenis Kelamin --</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
            </select>
        </p>

        <p>
            <label for="tahunMasuk">Tahun Masuk</label><br>
            <input type="text" id="tahunMasuk" name="tahunMasuk">
        </p>

        <p>
            <button type="submit" class="tombol-form">Kirim Biodata</button>
        </p>

    </form>
